server.port=8080

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/spmia-realm

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/spmia-realm/protocol/openid-connect/certs

management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always